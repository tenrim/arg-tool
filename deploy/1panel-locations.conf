# 1Panel / OpenResty 配置参考：合并到现有 server {} 内。
# 保留面板生成的 listen、server_name、root、SSL 和 ACME 配置。
# 替换重复的 location /；移除冲突的旧静态缓存规则，不能重复粘贴。
index index.html;
autoindex off;

# 文件名未带版本号，更新后必须重新验证缓存，避免新旧运行引擎混用。
add_header Cache-Control "no-cache" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location / {
    try_files $uri $uri/ =404;
}

# 资料仍请求 .json；现有 .json.gz 仅作为 HTTP 压缩副本，不作为下载地址。
# 未安装 gzip_static 模块时删去该指令，完整 .json 仍可直接使用。
location ~* \.json$ {
    types { application/json json; }
    gzip_static on;
    gzip_vary on;
    try_files $uri =404;
}

# 确保模块与 WASM 类型正确；不存在的运行包必须返回 404，不能返回 index.html。
location ~* \.(?:js|mjs|wasm)$ {
    types {
        text/javascript js mjs;
        application/wasm wasm;
    }
    try_files $uri =404;
}
